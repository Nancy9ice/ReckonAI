# Alembic configuration.
#
# The generated template's commentary has been removed rather than left in
# place; specs/tech-stack.md section 13 applies to scaffolded files too.

[alembic]
script_location = %(here)s/src/reckonai/migrations
prepend_sys_path = . src
path_separator = os

# Left empty on purpose, and read by env.py from reckonai.config.Settings
# instead. A value here would be a second source of truth for which database a
# migration runs against, and a stale one could point a migration at the wrong
# database - the one mistake in this file that is unrecoverable.
sqlalchemy.url =

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging for the alembic CLI itself. Application logging is configured in
# reckonai.logging; this section governs tool output only.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
