[project]
name = "reckonai"
version = "0.1.0"
description = "AI-powered financial reconciliation and investigation agent for marketplace operators using PayPal"
readme = "readme.md"
requires-python = ">=3.12,<3.13"

# Runtime dependencies are locked by specs/tech-stack.md section 1. Adding one
# that is not listed there requires amending that document first.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Pinned to the 2.0 series on purpose. tech-stack.md section 1 locks
    # "SQLAlchemy 2.0 (typed)", and an open constraint resolves to 2.1, which
    # would be a silent amendment to a locked decision. 2.0 carries the typed
    # Mapped[] declarative API that section 3 actually describes.
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # The marketplace connector's HTTP client, and Block D's PayPal client.
    # `httpx2` rather than `httpx`: Starlette deprecated the latter as its
    # TestClient transport and warns on every test run, so this project
    # already had httpx2 for tests. Two HTTP stacks in one process, differing
    # between the test path and the production path, is the shape of a bug
    # that only appears in deployment. tech-stack.md section 1 locks it, added
    # there 2026-11-08.
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reckonai"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # httpx2 moved to the runtime dependencies in Block A - the connector
    # needs it at runtime, and Starlette's TestClient takes its transport from
    # the same package.
    "ruff>=0.8",
    # Declared explicitly rather than relied on transitively through
    # uvicorn[standard]: tests/test_render_blueprint.py parses render.yaml, and
    # a test's dependency should not vanish because a runtime extra changed.
    "pyyaml>=6",
    # Added in Phase 10. A dev dependency, so specs/tech-stack.md section 1 -
    # which locks *runtime* dependencies - does not need amending.
    #
    # Scoped to `src/reckonai/engine/` by the [tool.mypy] config below, and
    # gated in CI there only. The reasoning is in
    # specs/2026-11-09-entitlement-engine/requirements.md D9: the engine is the
    # module where a type error is a wrong financial answer rather than a
    # crash, and it is the only package that already passes --strict.
    "mypy>=1.13,<2",
]

# ---------------------------------------------------------------------------
# Ruff. The rule set is deliberately small: a large selection enabled on an
# empty repository produces noise that gets suppressed rather than fixed
# (specs/2026-11-07-repo-deployment-skeleton/plan.md Group 1 step 5).
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py312"

# The disposable PEP 723 probe scripts from Phases 0 and 0b are not part of this
# package and are run standalone. requirements.md section 4 keeps them exactly as
# they are: they produced the committed evidence in specs/paypal-fields.md and
# Phase 0's validation re-runs them, so reformatting them now would edit
# evidence-producing code for no benefit.
exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import ordering, so diffs stay deterministic
    "UP", # pyupgrade
    "B",  # flake8-bugbear, which catches real defects rather than style
]

[tool.ruff.lint.per-file-ignores]
# Alembic's revision template supplies `op` and `sa` to every revision, and a
# revision that needs neither - an empty one, or a data-only one - leaves them
# unused. Autogenerated column definitions also run long. Neither is worth
# hand-editing generated migrations over, and the alternative is a lint gate
# that every future migration trips.
"src/reckonai/migrations/versions/*.py" = ["F401", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ---------------------------------------------------------------------------
# Mypy. Added in Phase 10, deliberately **narrow**: strict over
# `src/reckonai/engine/` and nothing else.
#
# Why not the whole package. Running it over `src/` for the first time reported
# 39 errors, of which 32 were a single inaccurate annotation on `Money` (now
# fixed - see the TYPE_CHECKING block in money/value.py). Of the seven that
# remain, two are a **mypy limitation rather than a defect**: a SQLAlchemy
# `Mapped[X]` attribute does not satisfy a Protocol member declared as `X`,
# although instance access genuinely resolves to `X` at runtime and the ORM
# classes do satisfy these protocols. Gating on that would mean suppressing a
# false report at every ORM-to-engine boundary.
#
# So the gate goes where it pays: the engine is pure functions where a type
# error is a wrong financial answer rather than a crash, it imports no ORM by
# design (specs/tech-stack.md section 6), and it is the one package that
# already passes --strict. The remaining five errors are recorded as a debt in
# specs/2026-11-09-entitlement-engine/validation.md section 7 rather than
# suppressed here.
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src/reckonai/engine"]
python_version = "3.12"
strict = true
