# Render Blueprint - the deployed topology, version controlled rather than
# configured by hand in the dashboard (specs/tech-stack.md section 11).
#
# Three components and no more: one web service, one worker, one managed
# Postgres. The job queue is tables inside that same database rather than a
# fourth service, and that co-location is the design: it is what lets a dedupe
# marker and the financial write it guards share one transaction (section 4).
#
# APPLY THIS AGAINST main. The Blueprint tracks main by decision
# (specs/2026-11-07-repo-deployment-skeleton requirements.md D4), which is why
# the deployed health checks are a post-merge gate rather than a pre-merge one.
#
# FIELDS THAT CANNOT BE CHANGED AFTER THE DATABASE IS CREATED:
#   name, region, postgresMajorVersion, databaseName, user
# A wrong value in any of those is permanent short of destroying the instance
# and losing its data, so the first apply is not a step to improvise through.
# By contrast `plan` and `ipAllowList` can be changed later, and `diskSizeGB`
# can only ever grow.
#
# The Python version comes from the committed .python-version file (3.12). It
# is deliberately not repeated here as a PYTHON_VERSION variable - two sources
# of truth for a runtime version is how a build starts differing from local.

services:
  # ---------------------------------------------------------------------------
  # The API. Starter rather than free: a free instance spins down after 15
  # minutes idle and takes about a minute to wake, which would open a judged
  # demo on a blank page (specs/tech-stack.md section 11).
  # ---------------------------------------------------------------------------
  - type: web
    name: reckonai-api
    runtime: python
    plan: starter
    region: frankfurt
    branch: main

    # --no-dev keeps pytest and ruff out of the deployed image. The lockfile
    # stays authoritative either way - the same resolution, a subset installed -
    # and it has a second benefit: a runtime module that accidentally imports a
    # dev-only package passes CI and fails here, loudly, rather than shipping.
    # The dashboard build is appended and **fails soft, whatever the cause**:
    # a missing Node (Render's Python runtime is believed to ship it, on
    # informal sources only), a registry blip, or a type error must not take
    # the API down. Without a build `/` serves the JSON index (`reckonai.spa`),
    # so the failure is visible after deploy rather than fatal during it. CI
    # builds the dashboard on every push, so a real break fails there first.
    # specs/2026-11-10-queue-approval-dashboard/validation.md section 3.
    buildCommand: >
      pip install uv && uv sync --frozen --no-dev &&
      (cd frontend && npm ci && npm run build ||
      echo "WARNING: dashboard build failed or npm is missing, serving the API only")

    # Migrations run here, never in startCommand. Pre-deploy runs once per
    # deploy; a start command would have every instance race to migrate on
    # every restart - survivable at one instance, a lock-contention bug at two
    # (requirements.md D7). A failing migration blocks the deploy, which is the
    # failure mode worth having.
    # --no-sync on every `uv run` below. Without it `uv run` re-syncs the
    # environment before executing, which (a) undoes the --no-dev above by
    # reinstalling pytest and ruff, and (b) does network installs at container
    # start, before the port is bound. Verified locally 2026-11-07: a bare
    # `uv run uvicorn` after a --no-dev build installed 9 packages.
    # Migrations, then the demo dataset. Both run once per deploy, before
    # any instance serves traffic.
    #
    # **`--ensure` makes no outbound call**, which is why it is safe here.
    # It seeds the marketplace and replays the captured PayPal fixtures, and
    # returns early when the tenant already exists - so a redeploy, or a
    # rollback re-running this, changes nothing. Capturing *from* PayPal is a
    # separate script that must never run on a deploy: a sandbox 5xx would
    # fail the pre-deploy and take the whole service down, which is the
    # failure mode the replan's R6 removed.
    #
    # It is here because Phase 14's dashboard is a static site that renders
    # what the API returns: deployed and reachable with an empty database
    # demonstrates nothing.
    preDeployCommand: >
      uv run --no-sync alembic upgrade head &&
      uv run --no-sync python -m reckonai.demo_data --ensure

    startCommand: uv run --no-sync uvicorn reckonai.app:app --host 0.0.0.0 --port $PORT

    # Liveness, which touches no database. Pointing this at the readiness route
    # would couple restarts to database health: connections exhausted, check
    # fails, Render restarts, the new process rebuilds its pool, check fails
    # again. A restart adds no connections, so the loop never converges.
    # /health/ready carries the database question instead.
    healthCheckPath: /health

    envVars:
      # The credential is never written down. Render generates the password when
      # it creates the instance below and injects the connection string at
      # deploy time (specs/tech-stack.md section 10).
      - key: DATABASE_URL
        fromDatabase:
          name: reckonai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: NODE_VERSION
        value: "22"
      # AG Grid Enterprise licence, read by Vite at BUILD time and embedded in
      # the shipped JavaScript (that is how AG Grid licensing works). Unset, the
      # grid shows an evaluation watermark and nothing breaks.
      - key: VITE_AG_GRID_LICENSE_KEY
        sync: false
      # The dashboard's natural-language assistant (`/api/grid-assistant`)
      # calls the model from this service, so the same four variables the worker
      # declares are declared here. See the worker's comment for the rules.
      - key: AGENT_PROVIDER
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # PayPal sandbox credentials, for the demo's one live order (R15).
      # `sync: false` means Render prompts for the value rather than reading
      # it from this file, so no credential enters the repository - the same
      # reasoning as the database URL below.
      #
      # **Optional.** Absent, the live call is skipped and the demo proceeds
      # from the replayed fixtures, which is R15's stated behaviour. The
      # reconciliation never calls PayPal either way (R6).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # ---------------------------------------------------------------------------
  # The queue consumer. A separate process, not a thread inside the web service
  # (specs/tech-stack.md sections 4 and 11). In Phase 1 it starts, logs and
  # stays up; Phase 8 gives it the jobs table to claim against.
  # ---------------------------------------------------------------------------
  - type: worker
    name: reckonai-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install uv && uv sync --frozen --no-dev

    # No preDeployCommand on purpose. The web service owns migrations, and two
    # components racing to migrate is the problem D7 avoids.
    startCommand: uv run --no-sync python -m reckonai.worker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reckonai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Stated explicitly even though it matches the code's default, so the
      # value is auditable and survives a change of default - the same
      # reasoning specs/tech-stack.md section 5.1 applies to model settings.
      - key: WORKER_TICK_SECONDS
        value: "30"

      # The investigation agent runs here, as a queued job (Block F D2), so
      # the credential belongs on the worker and nowhere else. `sync: false`:
      # Render prompts for the value and it never enters the repository.
      #
      # **Without a key every investigation fails, legibly** - the job's
      # `last_error` names the missing variable and the dashboard shows it.
      # Set the pair for ONE provider; the provider choice is the operator's
      # and there is no failover between them (investigation-agent
      # validation.md section 8 item 7). Unset, the code defaults to
      # `anthropic` / `claude-haiku-5-5`, whose account had no credit on
      # 2026-11-10; `openai` / `gpt-4.1` is the provider the criteria were met
      # on. The OpenAI key cannot reach gpt-5 or gpt-5-mini.
      - key: AGENT_PROVIDER
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # The scheduled reconciliation. Block D
  # (specs/2026-11-09-queue-scheduled-run/requirements.md D8, D9).
  #
  # **APPLIED 2026-11-10 14:27 UTC, and not yet observed to fire.** The
  # Blueprint sync that the merge of PR #22 triggered created this service
  # (deploy trigger `blueprint_sync`, live). Render does not run a cron job
  # when it is created, only on its schedule, so the first tick is
  # 01:00 UTC on 2026-11-11 and Phase 8's "the cron job fires a date-windowed
  # run on the deployed environment" stays unproven until it does.
  #
  # This comment used to say "declared but not applied ... deferred to Block
  # F, which owns the next deploy". That was wrong, and wrong in a way that
  # mattered: **every merge to `main` deploys.** Both services track `main`
  # with no `autoDeploy` override, so PRs #19, #20, #21 and #22 each produced
  # a `new_commit` deploy of the web service and the worker, and #22's also
  # synced this Blueprint. There is no "one remaining deploy" to budget; a
  # merge is the deploy, migrations and demo seed included.
  #
  # **It enqueues; it does not reconcile.** The worker above is what executes.
  # A cron invocation that did the work itself would be a third process
  # writing financial rows and racing the worker it was meant to feed, and
  # `FOR UPDATE SKIP LOCKED` protects the queue rather than whoever bypasses
  # it.
  #
  # Daily, at 01:00 UTC. It was hourly, with a comment claiming that picked a
  # late PayPal record up within the hour; code review found that false. The
  # window bounds snap to midnight UTC and the idempotency key uses only their
  # dates, so every tick in a UTC day computes the same key: the first does the
  # work, the other 23 log a skip. Hourly bought nothing.
  #
  # 01:00 rather than 00:00 so the window's final day is a whole day behind the
  # provider, which specs/tech-stack.md section 8 records as roughly a day
  # behind anyway. The job is idempotent per window regardless - the
  # `processed_event` unique constraint guarantees that, not this schedule.
  #
  # `--window-days 2`, not 1: the reporting APIs are eventually consistent and
  # roughly a day behind (specs/tech-stack.md section 8), so a one-day window
  # closes before the evidence for its final hours has arrived.
  # ---------------------------------------------------------------------------
  - type: cron
    name: reckonai-recon
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install uv && uv sync --frozen --no-dev
    schedule: "0 1 * * *"

    # No preDeployCommand. The web service owns migrations (D7), and a cron
    # job racing it to migrate is the problem that avoids.
    #
    # --no-sync for the reason documented on the services above: without it
    # `uv run` re-syncs first, undoing the build's --no-dev and doing network
    # installs at container start.
    startCommand: >
      uv run --no-sync python -m reckonai.jobs.schedule --window-days 2

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reckonai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

# No static site yet. The frontend is Phase 14 (requirements.md D1).

databases:
  - name: reckonai-db

    # A plan id, not the display name. `Basic-256mb` is rejected; `0.1c-256mb`
    # is the same instance spelled the way the Blueprint expects.
    #
    # Chosen on cost: Basic-1gb priced at $23.50 a month against roughly $6
    # here, and the credits have to cover the whole project. Every Basic tier
    # caps at 100 connections, so nothing about the budget changes - but 256MB
    # is tight for Postgres, which is why the pools in requirements.md D6 were
    # trimmed to a peak of 16 rather than left at 21.
    plan: 0.1c-256mb

    region: frankfurt

    # Set explicitly because Render otherwise provisions the latest major
    # version, and this field cannot be changed afterwards. 16 is what
    # specs/tech-stack.md section 1 locks, and what compose.yaml and CI run, so
    # a migration cannot pass locally and fail here on a version difference.
    postgresMajorVersion: "16"

    # Internal Render traffic only. An absent ipAllowList means allow every IP
    # on a new database, and this repository becomes public at submission, so
    # an allowlisted CIDR would publish which address may reach a database whose
    # name, user and region sit in this same file. It also fails closed: an
    # address added in the dashboard for one debugging session is removed again
    # by the next Blueprint sync (requirements.md D13).
    ipAllowList: []
